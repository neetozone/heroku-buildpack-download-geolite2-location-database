api = "0.10"

[buildpack]
  id = "neeto-deploy/ip-location"
  version = "0.0.3"
  name = "NeetoDeploy IP Location Buildpack"
  description = "A Cloud Native Buildpack that downloads GeoLite2 City database for IP location lookup"

[metadata]
  include-files = ["bin/build", "bin/detect", "buildpack.toml"]

[[stacks]]
  id = "*"

[[targets]]
os = "linux"
arch = "amd64"

[[targets]]
os = "linux"
arch = "arm64"

